<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Split a bill into the fewest payments, each under your limit." />
    <title>Bill Split</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <p class="eyebrow">Payment helper</p>
        <h1>Split the bill</h1>
        <p class="subtitle">
          Break one total into the minimum number of charges, each under your limit, with varied amounts.
        </p>
      </header>

      <section class="card panel">
        <form id="split-form" class="form">
          <label class="field">
            <span class="label">Total amount</span>
            <div class="input-wrap">
              <span class="prefix" aria-hidden="true">₹</span>
              <input
                id="total"
                name="total"
                type="number"
                inputmode="decimal"
                min="0.01"
                step="0.01"
                placeholder="6500"
                required
              />
            </div>
          </label>

          <label class="field">
            <span class="label">Max per transaction</span>
            <div class="input-wrap">
              <span class="prefix" aria-hidden="true">₹</span>
              <input
                id="max-per-tx"
                name="maxPerTx"
                type="number"
                inputmode="decimal"
                min="1"
                step="0.01"
                value="2000"
                required
              />
            </div>
            <span class="hint">Each charge stays strictly below this (default 2000).</span>
          </label>

          <div class="actions">
            <button type="submit" class="btn primary">Split bill</button>
            <button type="button" id="reshuffle" class="btn secondary" disabled>
              Shuffle again
            </button>
          </div>
        </form>
      </section>

      <section id="results" class="card results hidden" aria-live="polite">
        <div class="results-head">
          <div>
            <h2>Transactions</h2>
            <p id="summary" class="summary"></p>
          </div>
          <button type="button" id="copy-all" class="btn ghost">Copy all</button>
        </div>
        <ol id="tx-list" class="tx-list"></ol>
        <p id="verify" class="verify"></p>
      </section>

      <footer class="footer">
        <p>Runs in your browser — nothing is sent to a server.</p>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
